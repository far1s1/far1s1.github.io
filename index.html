<style>

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Geeza Pro",Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}

.rule{width:60px;height:5px;border-radius:3px;background:var(--gold);margin:18px auto}
